<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gearly JWT Testing UI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>GEARLY</h1>
            <p>Car Parts Marketplace (Auth Test)</p>
        </header>
        
        <nav>
            <button onclick="showSection('signup-section')">Signup</button>
            <button onclick="showSection('login-section')">Login</button>
            <button onclick="showSection('dashboard-section')">Dashboard</button>
        </nav>

        <hr>

        <!-- SIGNUP SECTION -->
        <section id="signup-section" class="active">
            <h2>Signup</h2>
            
            <div class="tabs">
                <button onclick="switchSignup('user')">User Signup</button>
                <button onclick="switchSignup('shopkeeper')">Shopkeeper Signup</button>
            </div>

            <!-- User Signup Form -->
            <form id="form-signup-user" onsubmit="handleSignup(event, 'user')">
                <h3>User Signup</h3>
                <input type="text" id="su-first_name" placeholder="First Name" required>
                <input type="text" id="su-username" placeholder="Username" required>
                <input type="email" id="su-email" placeholder="Email" required>
                <input type="text" id="su-phone_number" placeholder="Phone Number" required>
                <input type="password" id="su-password" placeholder="Password" required>
                <button type="submit">Sign Up as User</button>
            </form>

            <!-- Shopkeeper Signup Form -->
            <form id="form-signup-shopkeeper" onsubmit="handleSignup(event, 'shopkeeper')" style="display: none;">
                <h3>Shopkeeper Signup</h3>
                <input type="text" id="ss-shop_name" placeholder="Shop Name" required>
                <input type="text" id="ss-username" placeholder="Username" required>
                <input type="email" id="ss-email" placeholder="Email" required>
                <input type="text" id="ss-phone_number" placeholder="Phone Number" required>
                <input type="password" id="ss-password" placeholder="Password" required>
                <button type="submit">Sign Up as Shopkeeper</button>
            </form>
            
            <div id="signup-status" class="status-box"></div>
        </section>

        <!-- LOGIN SECTION -->
        <section id="login-section">
            <h2>Login</h2>
            <form id="form-login" onsubmit="handleLogin(event)">
                <input type="text" id="login-identifier" placeholder="Username or Email" required>
                <input type="password" id="login-password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
            
            <div id="login-status" class="status-box"></div>
            
            <div class="jwt-box">
                <h4>JWT Status</h4>
                <p id="jwt-stored-status">Stored: NO</p>
                <textarea id="jwt-display" readonly placeholder="No token currently stored..."></textarea>
            </div>
            
            <div class="jwt-controls">
                <button onclick="clearJwt()">Clear JWT</button>
                <button onclick="logout()">Logout</button>
                <button onclick="showSection('dashboard-section')">Access Dashboard</button>
            </div>
        </section>

        <!-- DASHBOARD SECTION -->
        <section id="dashboard-section">
            <h2>Protected Dashboard</h2>
            <div class="jwt-status-inline">
                JWT Status: <span id="dash-jwt-status">Not Stored</span>
            </div>
            <br>
            <button onclick="accessDashboard()">Access Protected Dashboard</button>

            <div id="dashboard-result" class="status-box">
                <div id="dashboard-http-status"></div>
                <div id="dashboard-auth-status"></div>
                <div id="dashboard-response"></div>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
